# Homepage content, single source for both language homepages.
# Rendered by _layouts/home.html via site.data.home[page.lang].

en:
  hero:
    eyebrow: Ahmed Assalih
    position: Executive HR Transformation & AI Strategist
    title: Bridging business, HR and technology to make transformation deliver.
    lead: >-
      25 years across EMEA as a regional business leader, HR executive, technology
      architect, advisor, author and professor.
    primary: { label: Explore my work, url: /en/expertise/ }
    secondary: { label: Discover The Death of Skills, url: /en/book/ }
    tertiary: { label: Speaking & Teaching, url: /en/speaking/ }
    image_alt: Ahmed Assalih

  proof:
    - stat: 25 years
      label: HR · Technology · Business
    - stat: MEA + Europe
      label: International leadership
    - stat: 22 countries · 50+ entities
      label: Multi-country transformation
    - stat: Business Unit builder
      label: Strategy to delivery
    - stat: Author & Professor
      label: The Death of Skills · 2026

  lenses:
    heading: One career. Four lenses.
    intro: >-
      Executive leadership, HR, engineering and teaching rarely sit inside a single career.
      Here they do — and that combination is the point. Each lens changes what a transformation
      looks like, and what it takes to make it work.
    items:
      - num: "01"
        title: Executive Leadership
        tagline: Build. Scale. Deliver.
        body: >-
          Business Unit creation, business leadership, go-to-market, enterprise
          relationships, P&L discipline, multicultural teams and operational delivery.
        cta: Explore Executive Leadership
        url: /en/expertise/executive-leadership/
      - num: "02"
        title: Strategic Transformation
        tagline: Make complex transformation safer.
        body: >-
          HR transformation strategy, governance, programme recovery, solution selection,
          multi-country deployment and executive alignment.
        cta: Explore Strategic Transformation
        url: /en/expertise/hr-transformation/
      - num: "03"
        title: HR Tech & AI
        tagline: Understand what sits beneath the technology.
        body: >-
          HRIS architecture, data, AI, automation, integration, processes, governance
          and adoption.
        cta: Explore HR Tech & AI
        url: /en/expertise/hr-tech-ai/
      - num: "04"
        title: Future of Work
        tagline: Turn field experience into ideas.
        body: >-
          Author, professor and speaker exploring AI, skills, potential, learning,
          HR technology and the future of work.
        cta: Explore my ideas
        url: /en/ideas/

  impact:
    heading: Selected Impact
    intro: >-
      Three bodies of work rather than a chronology.
    cases:
      - title: Building an HR Transformation Business
        body: >-
          Built and scaled a regional HR Transformation Business Unit spanning offer
          strategy, go-to-market, business development, advisory and delivery.
        metrics:
          - { value: Business Unit, label: Built from the ground up }
          - { value: Double-digit, label: Annual growth }
          - { value: "~25%", label: Operating performance }
      - title: Transforming Talent Across 22 Countries
        body: >-
          Unified Talent Management transformation across more than 50 entities in
          22 countries, navigating cultural and regulatory diversity.
        metrics:
          - { value: "22", label: Countries }
          - { value: "50+", label: Entities }
          - { value: Multi-country, label: Governance model }
      - title: From HRIS Architecture to HR Leadership
        body: >-
          Started by leading HRIS implementation and architecture across a major airline
          group and its subsidiaries, then moved into Talent leadership and ultimately
          HR leadership for 6,000+ employees.
        metrics:
          - { value: "10", label: Subsidiaries }
          - { value: 5 + 20, label: Developers and HR experts }
          - { value: "6,000+", label: Employees }

  method:
    eyebrow: Intellectual property
    heading: The Logician-Engineer Method
    lead: >-
      Complex transformation does not fail because organisations lack technology.
      It fails when strategy, architecture, data, processes and adoption are treated
      separately.
    steps:
      - num: "01"
        title: Diagnose
        question: What is really broken?
        items: [Data, Processes, Organisation, Technology, Governance]
      - num: "02"
        title: Architect
        question: What should the target model become?
        items: [HR model, Systems, Data flows, AI, Operating model]
      - num: "03"
        title: Make it live
        question: How will the organisation actually adopt it?
        items: [Governance, Decision rights, Change, Capabilities, Measurement]
    cta: { label: Discover the Method, url: /en/ideas/logician-engineer-method/ }

  book:
    label: New book · 2026
    title: The Death of Skills
    subtitle: What AI reveals about your talent — and what your skills are hiding from you.
    body:
      - >-
        The argument is not that skills disappear. It is that organisations relying only
        on visible, current skills fail to see potential, adaptability, trajectory and
        learning velocity.
      - >-
        AI is putting pressure on talent models built around visible, current skills.
        The book sets out what those models can rest on instead.
    frameworks_label: Five frameworks from the book
    frameworks: [Potential Stack, Time-to-Skill, "Fortress · Front Line · Laboratory", Trajectory Radar, Pay-for-Agility]
    primary: { label: Discover the Book }
    secondary: { label: Explore the frameworks, url: /en/ideas/frameworks/ }

  insights:
    heading: Ideas & Insights
    intro: >-
      Field experience, research and frameworks on HR transformation, AI and the
      future of work.
    cta: { label: View all insights, url: /en/insights/ }

  speaking:
    heading: I teach what I have practised.
    sub: >-
      A practical perspective drawn from real transformations rather than purely
      theoretical commentary.
    areas:
      - title: Keynotes
        body: AI · Future of Work · Skills · HR Transformation
      - title: Executive education
        body: Executive committees · CHRO teams · HR leadership
      - title: University
        body: HR Master's programmes · HR Tech · AI · Digital Transformation
    primary: { label: Speaking & Teaching, url: /en/speaking/ }
    secondary: { label: Invite Ahmed, url: /en/contact/ }

  about:
    eyebrow: About Ahmed
    heading: Engineer. HR leader. Entrepreneur. Business Unit builder. Author.
    body:
      - >-
        Trained as an engineer at ENSEEIHT in Toulouse, Ahmed began his career in 2001 at
        Royal Air Maroc, deploying HR Access across the group and around ten subsidiaries
        while leading a mixed team of developers and HR experts. He moved from systems to
        people: Talent and Recruiting, then Head of HR for an airline group of more than
        6,000 employees.
      - >-
        In 2013 he became an entrepreneur, founding Créative RH Consulting before joining
        Advyteam Group as Partner and General Manager for Morocco, where he built the
        consulting business and founded Advyteam Academy. Since 2017 he has led HR
        Transformation for Sopra HR Software in the MEA region, launching and scaling a
        Business Unit that runs from offer strategy to delivery.
      - >-
        Today he also teaches on HR Master's programmes, speaks internationally, and
        writes. His 2026 book, The Death of Skills, argues that AI is exposing the limits
        of skills-based talent models.
    cta: { label: Read the full story, url: /en/about/ }

  contact:
    heading: Start a conversation
    intro: >-
      Open to selected executive opportunities, strategic assignments, speaking and
      academic collaborations across EMEA.
    intentions:
      - Executive & leadership opportunities
      - Strategic transformation & advisory
      - Speaking & media
      - Teaching & academic collaboration
    cta: { label: Contact Ahmed, url: /en/contact/ }

