          le conseil et la delivery.
        metrics:
          - { value: Business Unit, label: Créée de zéro }
          - { value: Croissance, label: À deux chiffres par an }
          - { value: "~25%", label: Performance opérationnelle (REX) }
      - title: Transformer le Talent dans 22 pays
        body: >-
          Transformation unifiée du Talent Management sur plus de 50 entités dans
          22 pays, avec la diversité culturelle et réglementaire que cela implique.
        metrics:
          - { value: "22", label: Pays }
          - { value: "50+", label: Entités }
          - { value: Multi-pays, label: Modèle de gouvernance }
      - title: De l’architecture SIRH à la direction RH
        body: >-
          D’abord la conduite du déploiement et de l’architecture SIRH d’un grand groupe
          aérien et de ses filiales, puis la direction du Talent, et enfin la direction RH
          d’un groupe de plus de 6 000 collaborateurs.
        metrics:
          - { value: "10", label: Filiales }
          - { value: 5 + 20, label: Développeurs et experts RH }
          - { value: "6 000+", label: Collaborateurs }

  method:
    eyebrow: Propriété intellectuelle
    heading: La Méthode Ingénieur-Logicien
    lead: >-
      Une transformation complexe n’échoue pas par manque de technologie. Elle échoue
      quand la stratégie, l’architecture, les données, les processus et l’adoption sont
      traités séparément.
    steps:
      - num: "01"
        title: Diagnostiquer
        question: Qu’est-ce qui est réellement cassé ?
        items: [Données, Processus, Organisation, Technologie, Gouvernance]
      - num: "02"
        title: Architecturer
        question: Quel modèle cible construire ?
        items: [Modèle RH, Systèmes, Flux de données, IA, Modèle opérationnel]
      - num: "03"
        title: Faire vivre
        question: Comment l’organisation va-t-elle réellement l’adopter ?
        items: [Gouvernance, Droits de décision, Conduite du changement, Compétences, Mesure]
    cta: { label: Découvrir la méthode, url: /fr/idees/methode-ingenieur-logicien/ }

  book:
    label: Nouveau livre · 2026
    title: La Mort des Skills
    subtitle: Ce que l’IA révèle de vos talents — et ce que vos compétences vous cachent.
    body:
      - >-
        La thèse n’est pas que les compétences disparaissent. C’est qu’une organisation
        qui ne regarde que les compétences visibles et actuelles ne voit ni le potentiel,
        ni l’adaptabilité, ni la trajectoire, ni la vitesse d’apprentissage.
      - >-
        L’IA met sous tension les modèles de talent construits autour des compétences
        visibles et actuelles. Le livre propose ce sur quoi ils peuvent s’appuyer
        autrement.
    frameworks_label: Les cinq frameworks du livre
    frameworks: [Potential Stack, Time-to-Skill, "Fortress · Front Line · Laboratory", Trajectory Radar, Pay-for-Agility]
    primary: { label: Découvrir le livre }
    secondary: { label: Explorer les frameworks, url: /fr/idees/frameworks/ }

  insights:
    heading: Idées & Analyses
    intro: >-
      Expérience de terrain, recherche et cadres de réflexion sur la transformation RH,
      l’IA et le futur du travail.
    cta: { label: Voir toutes les analyses, url: /fr/analyses/ }

  speaking:
    heading: J’enseigne ce que j’ai pratiqué.
    sub: >-
      Un regard concret, nourri par des transformations réelles plutôt que par un
      commentaire purement théorique.
    areas:
      - title: Keynotes
        body: IA · Futur du travail · Skills · Transformation RH
      - title: Executive education
        body: Comités exécutifs · Équipes DRH · Leadership RH
      - title: Université
        body: Masters RH · HR Tech · IA · Transformation digitale
    primary: { label: Conférences & Enseignement, url: /fr/conferences-enseignement/ }
    secondary: { label: Inviter Ahmed, url: /fr/contact/ }

  about:
    eyebrow: À propos d’Ahmed
    heading: Ingénieur. Dirigeant RH. Entrepreneur. Bâtisseur de Business Unit. Auteur.
    body:
      - >-
        Ingénieur de l’ENSEEIHT à Toulouse, Ahmed débute sa carrière en 2001 à Royal Air
        Maroc, où il déploie HR Access pour le groupe et une dizaine de filiales à la tête
        d’une équipe mixte de développeurs et d’experts RH. Il passe ensuite des systèmes
        aux personnes : Talent et recrutement, puis direction du département RH d’un groupe
        aérien de plus de 6 000 collaborateurs.
      - >-
        En 2013, il devient entrepreneur en fondant Créative RH Consulting, avant de
        rejoindre Advyteam Group comme Partner et Directeur Général Maroc, où il développe
        l’activité conseil et fonde Advyteam Academy. Depuis 2017, il dirige la
        transformation RH de Sopra HR Software sur la zone MEA et y a lancé une Business
        Unit qui va de la stratégie d’offre jusqu’à la delivery.
      - >-
        Il enseigne aujourd’hui dans plusieurs Masters RH, intervient en conférence à
        l’international et écrit. Son livre 2026, La Mort des Skills, montre comment l’IA
        révèle les limites des modèles de talent fondés sur les compétences.
    cta: { label: Lire le parcours complet, url: /fr/a-propos/ }

  contact:
